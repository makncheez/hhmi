<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HHMI Janelia · Build 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preload" href="assets/ABCDiatype-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --page-bg: #808080;            /* placeholder page background */
    --tile: #000;
    --ink: #fff;
    --green-1: #a5f300;            /* menu icon: lime */
    --green-2: #00ac1d;            /* menu icon: mid green */
    --green-3: #006b2a;            /* menu icon: dark green */
    --bar-h: 56px;
    --font-sans: "ABC Diatype", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font: 400 16px/1.4 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fixed menu bar (transparent, stays transparent on scroll) ---------- */
  .site-bar {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 1030;
    height: var(--bar-h);
    padding: 0 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    pointer-events: none;          /* clicks pass through the empty middle */
  }
  .site-bar > * { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink);
  }
  .brand-tile {
    display: flex;
    align-items: center;
    height: 48px;
    background: var(--tile);
    border-radius: 4px;
    color: var(--ink);
  }
  .brand-logo { padding: 0 6px; }
  .brand-logo svg { display: block; width: 78px; height: auto; }
  .brand-campus {
    padding: 0 12px;
    font-size: 21px;
    line-height: 1;
    letter-spacing: 0.005em;
    white-space: nowrap;
  }

  .explore {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 8px 8px;
    border: 0;
    background: none;
    color: var(--ink);
    font: 400 15px/1 var(--font-sans);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .explore-icon {
    position: relative;
    width: 32px;
    height: 27px;
  }
  .explore-icon i {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
  }
  .explore-icon i:nth-child(1) { top: 0;    background: var(--green-1); }
  .explore-icon i:nth-child(2) { top: 12.5px; background: var(--green-2); }
  .explore-icon i:nth-child(3) { bottom: 0; background: var(--green-3); }
  .explore:focus-visible { outline: 2px solid var(--green-1); outline-offset: 2px; }

  @media (max-width: 575.98px) {
    .site-bar { padding-right: 12px; }
    .brand-tile { height: 40px; }
    .brand-logo svg { width: 64px; }
    .brand-campus { font-size: 15px; padding: 0 10px; }
    .explore-label { display: none; }
  }

  /* ---------- Hero: inset video that unmasks to full bleed over the first 80px ----------
     The section is 100vh + 80px tall; its stage is sticky, so the video stays
     pinned while it grows, then the section scrolls away. JS sets the frame's
     box from scroll progress (0 = inset 16:9, 1 = full screen). */
  :root { --hero-unmask: 80px; --hero-top: 72px; --hero-dim: .55; }
  .hero {
    position: relative;
    height: calc(100vh + var(--hero-unmask));
    height: calc(100svh + var(--hero-unmask));
    background: #000;
  }
  .hero-stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  .hero-frame {
    position: absolute;
    overflow: hidden;
    background: #000;
    border-radius: 6px;
    will-change: left, top, width, height;
  }
  .hero-frame video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-frame::after {               /* darkening for text on top */
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    opacity: var(--hero-dim);
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .hero.is-watching .hero-frame::after { opacity: 0; }

  .watch {
    position: absolute;
    right: 24px;
    bottom: 20px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0 8px 8px;
    border: 0;
    background: none;
    color: var(--ink);
    font: 400 15px/1 var(--font-sans);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .3s ease;
  }
  .watch svg { width: 11px; height: 13px; fill: currentColor; }
  .watch:focus-visible { outline: 2px solid var(--green-1); outline-offset: 2px; }
  .watch .watch-stop { display: none; }
  .hero.is-watching .watch .watch-play { display: none; }
  .hero.is-watching .watch .watch-stop { display: flex; }
  .watch-play, .watch-stop { align-items: center; gap: 10px; }
  .watch-play { display: flex; }
  .watch-stop svg { width: 11px; height: 11px; }


  /* ---------- Headline over the video (not clipped by the frame) ---------- */
  .hero-copy {
    position: absolute;
    left: 0; right: 0;
    top: 45%;
    transform: translateY(-50%);
    z-index: 1;
    padding: 0 3vw;
    pointer-events: none;            /* Watch stays clickable underneath */
    transition: opacity .6s ease;
  }
  .hero-title {
    margin: 0;
    color: var(--ink);
    font: 400 4.74vw/1.08 var(--font-sans);
    letter-spacing: -0.005em;
    text-align: center;
  }
  .hero.is-watching .hero-copy { opacity: 0; }
  @media (max-width: 767.98px) {
    .hero-title { font-size: clamp(32px, 9vw, 56px); }
  }

  /* ---------- Decorative block: 4 divs in a 2 x 2 grid (reusable) ----------
     Usage: <div class="deco"><div></div><div></div><div></div><div></div></div>
     Order: top-left, top-right, bottom-left, bottom-right.
     Override --deco-w / --deco-h (whole block) or --deco-1..4 per instance. */
  .deco {
    --deco-w: 17px;
    --deco-h: 172px;
    --deco-1: #3fc2cd;   /* top-left: cyan */
    --deco-2: #000d42;   /* top-right: navy */
    --deco-3: #00ac1d;   /* bottom-left: green */
    --deco-4: #a5f300;   /* bottom-right: lime */
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: var(--deco-w);
    height: var(--deco-h);
    flex: none;
  }
  .deco > :nth-child(1) { background: var(--deco-1); }
  .deco > :nth-child(2) { background: var(--deco-2); }
  .deco > :nth-child(3) { background: var(--deco-3); }
  .deco > :nth-child(4) { background: var(--deco-4); }

  .hero-deco {
    position: absolute;
    top: 45%;
    transform: translateY(-50%);
    z-index: 1;
  }
  .hero-deco--left  { left: 0; }
  .hero-deco--right { right: 0; }
  @media (max-width: 575.98px) {
    .hero-deco { --deco-w: 10px; --deco-h: 100px; }
  }

  /* ---------- Units: heading, tabs, and a black full-width panel per tab ---------- */
  .units {
    background: #fbfbfb;
    color: #021341;
    padding-top: 150px;              /* space above "Four units…" */
  }
  .units-title {
    margin: 0 0 26px;
    font: 400 clamp(25px, 2.35vw, 40px)/1.15 var(--font-sans);
    letter-spacing: -0.005em;
    text-align: center;
  }
  .units-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: min(510px, 100%);
    margin: 0 auto;
  }
  .units-tab {
    position: relative;
    height: 35px;
    padding: 0 0 0 15px;
    border: 1px solid #5e5e5e;
    border-bottom: 0;
    border-radius: 7px 7px 0 0;
    background: #fff;
    color: #021341;
    font: 400 18px/1 var(--font-sans);
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }
  .units-tab + .units-tab { margin-left: -1px; }   /* touching tabs share one border line */
  .units-tab sup {
    top: -0.85em;
    margin-left: 3px;
    font-size: 9px;
    letter-spacing: 0.02em;
  }
  .units-tab[aria-selected="true"] { background: #a5f300; }
  .units-tab:focus-visible { outline: 2px solid #021341; outline-offset: -3px; }
  .units-panel {
    background: #000;
    color: var(--ink);
    min-height: 600px;
    padding: 56px 0;
  }
  .units-panel[hidden] { display: none; }
  @media (max-width: 575.98px) {
    .units-tab { padding-left: 8px; font-size: 15px; }
    .units-tab sup { font-size: 8px; margin-left: 1px; }
  }

  /* ---------- Placeholder content below the hero ---------- */
  .filler { min-height: 150vh; }
</style>
</head>
<body>

<header class="site-bar">
  <a class="brand" href="#" aria-label="HHMI Janelia Research Campus home">
    <span class="brand-tile brand-logo">
      <svg viewBox="0 0 128 38" role="img" aria-label="HHMI">
        <g fill="currentColor" fill-rule="evenodd"><path d="M0,0 L10.6326783,0 L10.6326783,13.3585568 L10.7405466,13.3585568 C12.5660116,11.2287875 14.9303817,9.68631694 19.4398916,9.68631694 C24.4354642,9.68631694 29,12.719323 29,19.0532334 L29,38 L18.3673217,38 L18.3673217,23.5222432 C18.3673217,20.3299697 17.9908742,18.0954648 14.8753558,18.0954648 C13.0498908,18.0954648 10.6326783,18.9991344 10.6326783,23.4175076 L10.6326783,38 L0,38 L0,0"/><path d="M33,0 L43.6324017,0 L43.6324017,13.3585568 L43.7402717,13.3585568 C45.5657641,11.2287875 47.9301699,9.68631694 52.4419312,9.68631694 C57.4353955,9.68631694 62,12.719323 62,19.0532334 L62,38 L51.3671616,38 L51.3671616,23.5222432 C51.3671616,20.3299697 50.9907084,18.0954648 47.8751431,18.0954648 C46.0500873,18.0954648 43.6324017,18.9991344 43.6324017,23.4175076 L43.6324017,38 L33,38 L33,0"/><path d="M66,10.6843569 L76.2404845,10.6843569 L76.2404845,14.3158571 L76.3481689,14.3158571 C78.4913943,11.1568585 81.6011638,10 85.4612366,10 C88.4637577,10 91.6794677,11.5257864 92.9673213,14.2619302 C93.3958791,13.9469292 95.5391046,10 102.456195,10 C109.586474,10 112,14.8422855 112,19.2617162 L112,38 L101.38371,38 L101.38371,23.2103574 C101.38371,20.6317141 101.115589,18.3141451 97.8998787,18.3141451 C95.2182311,18.3141451 94.3079271,20.3684999 94.3079271,23.2103574 L94.3079271,38 L83.691637,38 L83.691637,23.2103574 C83.691637,20.6317141 83.4235158,18.3141451 80.2078057,18.3141451 C77.5261582,18.3141451 76.6162901,20.3684999 76.6162901,23.2103574 L76.6162901,38 L66,38 L66,10.6843569"/><path d="M127.750439,7 C127.911577,6.50960867 128,5.98823666 128,5.45015141 C128,2.43931982 125.314083,0 121.999327,0 C118.686366,0 116,2.43931982 116,5.45015141 C116,5.98823666 116.088872,6.50960867 116.250009,7 L127.750439,7"/><polygon points="116 38 127 38 127 10 116 10"/></g>
      </svg>
    </span>
    <span class="brand-tile brand-campus">Janelia Research Campus</span>
  </a>
  <button class="explore" type="button" aria-label="Explore menu" aria-expanded="false">
    <span class="explore-label">Explore</span>
    <span class="explore-icon" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</header>

<main>
  <section class="hero" id="hero" aria-label="Janelia Research Campus">
    <div class="hero-stage">
      <div class="hero-frame" id="heroFrame">
        <video id="heroVideo" src="assets/video/Janelia_Exterior.mp4"
               autoplay muted loop playsinline preload="auto"
               aria-label="Aerial view of the Janelia Research Campus"></video>
        <button class="watch" id="heroWatch" type="button">
          <span class="watch-play"><span>Watch</span><svg viewBox="0 0 11 13" aria-hidden="true"><path d="M0 0L11 6.5L0 13Z"/></svg></span>
          <span class="watch-stop"><span>Stop</span><svg viewBox="0 0 11 11" aria-hidden="true"><path d="M0 0H11V11H0Z"/></svg></span>
        </button>
      </div>
      <div class="hero-copy">
        <h1 class="hero-title">Understanding how brains generate behavior.</h1>
      </div>
      <div class="deco hero-deco hero-deco--left" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
      <div class="deco hero-deco hero-deco--right" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
    </div>
  </section>

  <section class="units" aria-labelledby="unitsTitle">
    <h2 class="units-title" id="unitsTitle">Four units. Connected scientific work.</h2>
    <div class="units-tabs" role="tablist" aria-label="Research units">
      <button class="units-tab" role="tab" id="tab-biology" aria-controls="panel-biology" aria-selected="true">Biology</button>
      <button class="units-tab" role="tab" id="tab-ai" aria-controls="panel-ai" aria-selected="false" tabindex="-1">AI<sup>@HHMI</sup></button>
      <button class="units-tab" role="tab" id="tab-tool" aria-controls="panel-tool" aria-selected="false" tabindex="-1">Tool<sup>@HHMI</sup></button>
      <button class="units-tab" role="tab" id="tab-theory" aria-controls="panel-theory" aria-selected="false" tabindex="-1">Theory<sup>@HHMI</sup></button>
    </div>
    <div class="units-panel" role="tabpanel" id="panel-biology" aria-labelledby="tab-biology">
      <div class="container"><div class="row"><div class="col-lg-6"></div><div class="col-lg-6"></div></div></div>
    </div>
    <div class="units-panel" role="tabpanel" id="panel-ai" aria-labelledby="tab-ai" hidden>
      <div class="container"><div class="row"><div class="col-lg-6"></div><div class="col-lg-6"></div></div></div>
    </div>
    <div class="units-panel" role="tabpanel" id="panel-tool" aria-labelledby="tab-tool" hidden>
      <div class="container"><div class="row"><div class="col-lg-6"></div><div class="col-lg-6"></div></div></div>
    </div>
    <div class="units-panel" role="tabpanel" id="panel-theory" aria-labelledby="tab-theory" hidden>
      <div class="container"><div class="row"><div class="col-lg-6"></div><div class="col-lg-6"></div></div></div>
    </div>
  </section>

  <div class="filler"></div>
</main>

<script>
(function () {
  var hero  = document.getElementById('hero');
  var frame = document.getElementById('heroFrame');
  var video = document.getElementById('heroVideo');
  var watch = document.getElementById('heroWatch');
  var UNMASK = 80, TOP = 72, RADIUS = 6;
  var ticking = false;

  function lerp(a, b, t) { return a + (b - a) * t; }

  // Scroll-linked unmask: inset 16:9 box -> full screen over the first 80px.
  function layout() {
    ticking = false;
    var vw = document.documentElement.clientWidth;
    var vh = hero.querySelector('.hero-stage').clientHeight;
    var share = vw < 576 ? 0.92 : 0.81;
    var w0 = vw * share, h0 = w0 * 9 / 16;
    var maxH = vh - TOP - 24;               // keep the inset box on screen
    if (h0 > maxH) { h0 = maxH; w0 = h0 * 16 / 9; }
    var x0 = (vw - w0) / 2;
    var t = Math.min(Math.max(window.scrollY / UNMASK, 0), 1);
    t = t * t * (3 - 2 * t);                // smoothstep easing
    frame.style.left   = lerp(x0, 0, t) + 'px';
    frame.style.top    = lerp(TOP, 0, t) + 'px';
    frame.style.width  = lerp(w0, vw, t) + 'px';
    frame.style.height = lerp(h0, vh, t) + 'px';
    frame.style.borderRadius = lerp(RADIUS, 0, t) + 'px';
  }
  function request() { if (!ticking) { ticking = true; requestAnimationFrame(layout); } }
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  layout();

  // Back to the dimmed, muted loop.
  function reset() {
    if (!hero.classList.contains('is-watching')) return;
    hero.classList.remove('is-watching');
    video.muted = true;
    video.loop = true;
    video.play().catch(function () {});
  }

  // Watch: restart from the beginning, unmuted, full brightness, play once.
  // While playing, the same button reads Stop and returns to the dimmed loop.
  watch.addEventListener('click', function () {
    if (hero.classList.contains('is-watching')) { reset(); return; }
    hero.classList.add('is-watching');
    video.loop = false;
    video.currentTime = 0;
    video.muted = false;
    video.play().catch(function () { reset(); });
  });
  video.addEventListener('ended', reset);

  // Scrolling the hero mostly out of view also returns it to the dimmed loop.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.intersectionRatio < 0.4) reset(); });
    }, { threshold: [0, 0.4] }).observe(hero);
  }
})();

// Units tabs: each tab shows its own panel; arrow keys, Home and End move between tabs.
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.units-tab'));
  function select(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(tab); });
    tab.addEventListener('keydown', function (e) {
      var n = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (n === undefined) return;
      e.preventDefault();
      var next = tabs[(n + tabs.length) % tabs.length];
      select(next); next.focus();
    });
  });
})();
</script>

</body>
</html>
