<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HHMI Janelia · Build 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preload" href="assets/ABCDiatype-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --page-bg: #808080;            /* placeholder page background */
    --tile: #000;
    --ink: #fff;
    --green-1: #a5f300;            /* menu icon: lime */
    --green-2: #00ac1d;            /* menu icon: mid green */
    --green-3: #006b2a;            /* menu icon: dark green */
    --bar-h: 56px;
    --font-sans: "ABC Diatype", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font: 400 16px/1.4 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fixed menu bar (transparent, stays transparent on scroll) ---------- */
  .site-bar {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 1030;
    height: var(--bar-h);
    padding: 0 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    pointer-events: none;          /* clicks pass through the empty middle */
  }
  .site-bar > * { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink);
  }
  .brand-tile {
    display: flex;
    align-items: center;
    height: 48px;
    background: var(--tile);
    border-radius: 4px;
    color: var(--ink);
  }
  .brand-logo { padding: 0 6px; }
  .brand-logo svg { display: block; width: 78px; height: auto; }
  .brand-campus {
    padding: 0 12px;
    font-size: 21px;
    line-height: 1;
    letter-spacing: 0.005em;
    white-space: nowrap;
  }

  .explore {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 8px 8px;
    border: 0;
    background: none;
    color: var(--ink);
    font: 400 15px/1 var(--font-sans);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .explore-icon {
    position: relative;
    width: 32px;
    height: 27px;
  }
  .explore-icon i {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
  }
  .explore-icon i:nth-child(1) { top: 0;    background: var(--green-1); }
  .explore-icon i:nth-child(2) { top: 12.5px; background: var(--green-2); }
  .explore-icon i:nth-child(3) { bottom: 0; background: var(--green-3); }
  .explore:focus-visible { outline: 2px solid var(--green-1); outline-offset: 2px; }

  @media (max-width: 575.98px) {
    .site-bar { padding-right: 12px; }
    .brand-tile { height: 40px; }
    .brand-logo svg { width: 64px; }
    .brand-campus { font-size: 15px; padding: 0 10px; }
    .explore-label { display: none; }
  }

  /* ---------- Filler so the fixed bar can be seen while scrolling ---------- */
  .filler { min-height: 300vh; padding-top: calc(var(--bar-h) + 48px); }
</style>
</head>
<body>

<header class="site-bar">
  <a class="brand" href="#" aria-label="HHMI Janelia Research Campus home">

    <span class="brand-tile brand-campus">Janelia Research Campus</span>
  </a>
  <button class="explore" type="button" aria-label="Explore menu" aria-expanded="false">
    <span class="explore-label">Explore</span>
    <span class="explore-icon" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</header>

<main class="filler">
  <div class="container"></div>
</main>

</body>
</html>
