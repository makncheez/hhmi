<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HHMI Grid</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Space+Mono&display=swap">
<style>
  /* Layout: Bootstrap grid with no gutters. Every cell draws its own four lines,
     pulled in at the ends, so lines never meet at intersections. */
  :root {
    --grid-bg: #DADADA;
    --grid-ink: #111;
    --grid-muted: #555;
    --grid-line: #111;
    --line-w: 1px;          /* line thickness */
    --gap-h: 12px;          /* horizontal lines: inset at each end */
    --gap-v-top: 24px;      /* vertical lines: inset at the top */
    --gap-v-bottom: 12px;   /* vertical lines: inset at the bottom */
    --cell-pad: clamp(20px, 2.6vw, 38px);
    --font-mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
    --font-sans: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--grid-bg);
    color: var(--grid-ink);
    font: 400 16px/1.4 var(--font-sans);
  }
  .grid-page {
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- The broken-line cell ----------
     ::before draws the top and bottom lines, ::after the left and right lines.
     Each line sits centered on the cell edge, so neighbours' lines overlap
     exactly and read as one line. The insets leave the corners open. */
  .gcell { position: relative; }
  .gcell::before,
  .gcell::after {
    content: "";
    position: absolute;
    pointer-events: none;
    border: 0 solid var(--grid-line);
  }
  .gcell::before {
    top: calc(var(--line-w) / -2);
    bottom: calc(var(--line-w) / -2);
    left: var(--gap-h);
    right: var(--gap-h);
    border-top-width: var(--line-w);
    border-bottom-width: var(--line-w);
  }
  .gcell::after {
    top: var(--gap-v-top);
    bottom: var(--gap-v-bottom);
    left: calc(var(--line-w) / -2);
    right: calc(var(--line-w) / -2);
    border-left-width: var(--line-w);
    border-right-width: var(--line-w);
  }
  .gcell-in { padding: calc(var(--cell-pad) + var(--gap-v-top) / 2) var(--cell-pad) var(--cell-pad); height: 100%; }

  /* ---------- Person card ---------- */
  .person { text-align: center; }
  .person img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #c8c8c8;
  }
  .person h3 {
    margin: clamp(24px, 3vw, 40px) 0 12px;
    font: 400 clamp(18px, 1.6vw, 22px)/1.2 var(--font-mono);
  }
  .person p {
    margin: 0 auto;
    max-width: 18em;
    font: 400 clamp(14px, 1.1vw, 16px)/1.4 var(--font-sans);
    text-wrap: balance;
  }

  /* Desktop: photo is 80% of the card width, with equal space above and at each side */
  @media (min-width: 992px) {
    .gcell-in.person { padding: 10% 10% var(--cell-pad); }
  }

  /* ---------- Story card ---------- */
  .story img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    background: #c8c8c8;
  }
  .story-foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-top: 24px;
  }
  .story h3 {
    min-width: 0;
    margin: 0;
    max-width: 24em;
    font: 400 clamp(17px, 1.5vw, 21px)/1.25 var(--font-sans);
  }
  .story a {
    flex: none;
    color: var(--grid-muted);
    font-size: 15px;
    text-decoration: none;
  }
  .story a:hover { color: var(--grid-ink); }
  .story a:focus-visible { outline: 2px solid var(--grid-ink); outline-offset: 3px; }
</style>
</head>
<body>

<main class="grid-page">
  <div class="container">
    <div class="row g-0" id="grid">

      <!-- Person cards: 4 per row on desktop, 2 on tablet, 1 on phone -->
      <template id="person-tpl">
        <div class="col-12 col-sm-6 col-lg-3 gcell">
          <article class="gcell-in person">
            <img src="https://www.hhmi.org/sites/default/files/2026-08/ann-hermundstad-400x400.png" alt="Ann Hermundstad" width="400" height="400" loading="lazy">
            <h3>Ann Hermundstad</h3>
            <p>Head of Theory@HHMI and Group Leader</p>
          </article>
        </div>
      </template>

      <!-- Story cards: 2 per row on desktop, 1 on smaller screens -->
      <template id="story-tpl">
        <div class="col-12 col-lg-6 gcell">
          <article class="gcell-in story">
            <img src="https://www.hhmi.org/sites/default/files/2025-12/20251203_investigator_lead.jpg" alt="A scientist looking through a microscope in a lab" loading="lazy">
            <div class="story-foot">
              <h3>Surveying the Genetic Battlefield to Uncover the Rules of Rapid Evolution</h3>
              <a href="#">Read More</a>
            </div>
          </article>
        </div>
      </template>

    </div>
  </div>
</main>

<script>
  // Placeholder content: 8 person cards, then 2 story cards.
  (function () {
    var grid = document.getElementById("grid");
    var person = document.getElementById("person-tpl");
    var story = document.getElementById("story-tpl");
    for (var i = 0; i < 8; i++) grid.appendChild(person.content.cloneNode(true));
    for (var j = 0; j < 2; j++) grid.appendChild(story.content.cloneNode(true));
  })();
</script>
</body>
</html>
