<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>HHMI Janelia Footer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&display=swap">
<style>
/* Layout: fixed black header; each top item opens a full-width black mega panel. Janelia uses a left rail of sections. */
:root{
  --black:#000; --white:#fff; --dim:#9a9a9a; --soft:#cfcfcf; --rule:#2b2b2b; --flag:#d8b85a; --green:rgb(0,154,76);
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--black);color:var(--white);font:400 15px/1.4 var(--font)}
h2,h3{font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.hero{position:relative;height:200vh;height:200svh;background:#111 url("https://www.hhmi.org/sites/default/files/styles/3840x2400/public/2024-01/hhmi-homepage-hero-desktop-1v3.jpg?itok=HIjV0wqK") center/cover no-repeat}

header.site{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--black)}
.bar{display:flex;align-items:center;gap:24px;height:76px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.brand{display:flex;color:var(--white);flex:none}
.brand svg{display:block}
.top{display:flex;gap:4px;margin:0 0 0 auto;list-style:none;padding:0}
.top>li>button{display:flex;align-items:center;gap:8px;height:76px;padding:0 14px;font-size:15px;position:relative}
.top>li>button::after{content:"";position:absolute;left:14px;right:14px;bottom:20px;height:2px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.top>li>button:hover::after,.top>li.open>button::after{transform:scaleX(1)}
.chev{width:9px;height:9px;transition:transform .2s}
.top>li.open .chev{transform:rotate(180deg)}
.toggle{display:none;margin-left:auto;border:1px solid var(--rule);padding:8px 14px}

.mega{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));background:var(--black);border-top:1px solid var(--rule);max-height:calc(100vh - 76px);overflow-y:auto;overscroll-behavior:contain;z-index:1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}
.top>li.open>.mega{z-index:2;opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease,visibility 0s}
.mega .inner{display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;padding-block:40px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.intro h2{font-size:36px;line-height:1.05;letter-spacing:-.01em;margin:0 0 12px}
.intro p{color:var(--dim);margin:0 0 18px;max-width:30ch}
.intro a.go{display:inline-flex;gap:8px;align-items:center;border-bottom:1px solid var(--dim);padding-bottom:2px}
.intro a.go:hover{border-color:var(--white)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:32px 36px;align-content:start}
.col{min-width:0}
.col h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.col h3 a:hover{color:var(--white)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.col li>a{display:block;padding:5px 0;line-height:1.3}
.col a:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.col ul ul{margin:2px 0 8px;padding-left:14px;border-left:1px solid var(--rule)}
.col ul ul a{color:var(--soft);font-size:14px}
.col .sub{margin-top:14px;padding-bottom:2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.col .sub:first-child{margin-top:0}
.q{display:flex;gap:10px;align-items:baseline}
.q a.t2{flex:1;min-width:0;font-size:14px}
.q .tech{flex:none;font-size:11px;color:var(--dim);border:1px solid var(--rule);padding:1px 6px}
.q .tech:hover{color:var(--white);border-color:var(--dim)}
.qrow{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
.qrow h4{font-weight:400;font-size:20px;margin:0 0 20px}
.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.flag{display:block;font-size:11px;color:var(--flag);margin-top:2px}
.sel .t{text-decoration:underline;text-underline-offset:4px}

.railwrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px}
.rail{list-style:none;margin:0;padding:0;border-right:1px solid var(--rule);align-self:start}
.rail button,.rail a{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 18px 10px 0;font-size:19px;color:var(--dim)}
.rail button[aria-selected="true"],.rail button:hover,.rail a:hover{color:var(--white)}
.arr{opacity:0;transition:opacity .15s}
.rail button[aria-selected="true"] .arr{opacity:1}
.tabpanel[hidden]{display:none}
.tabhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
.tabhead h3{font-size:26px;margin:0}
.tabhead a{color:var(--dim);border-bottom:1px solid var(--rule)}
.tabhead a:hover{color:var(--white)}

@media (max-width:1060px){
  .toggle{display:block}
  .bar{height:64px}
  .top{display:none;position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;background:var(--black);flex-direction:column;gap:0;overflow-y:auto;padding:8px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule)}
  .top.show{display:flex}
  .top>li{border-bottom:1px solid var(--rule)}
  .top>li>button{height:auto;padding:18px 0;font-size:20px;width:100%;justify-content:space-between}
  .top>li>button::after{display:none}
  .mega{position:static;max-height:none;border:0;overflow:visible;display:none;opacity:1;visibility:visible;pointer-events:auto;transition:none}
  .top>li.open>.mega{display:block}
  .mega .inner{padding-left:0;padding-right:0}
  .mega .inner,.railwrap{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:4px 24px}
  .intro h2{display:none}
  .rail{display:none}
  .tabpanel[hidden]{display:block}
  .tabpanel+.tabpanel{margin-top:28px}
  .cols,.cols.c4{grid-template-columns:1fr 1fr;gap:24px}
}
@media (max-width:560px){.cols,.cols.c4{grid-template-columns:minmax(0,1fr)}}
/* ---- Footer study: scrolling page, mega footer, particle wordmark revealed by the page lifting like a curtain ---- */
body.menu-lock{overflow:hidden}
body{margin:0}
.curtain{position:relative;z-index:1;background:var(--black)}
.mfoot{background:var(--black);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mfoot .in{max-width:1440px;margin:0 auto;padding-block:64px 28px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.mf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:36px;margin-bottom:40px;border-bottom:1px solid var(--rule)}
.mf-head h2{font-size:36px;line-height:1.05;letter-spacing:-.01em;margin:0;max-width:16ch}
.mf-head p{margin:0;color:var(--dim);font-size:15px}
.mf-cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:40px 28px}
.mf-cols .col h3{margin-bottom:12px}
.mf-cols li>a{font-size:14px}
.mf-base{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);font-size:12px;color:var(--dim)}
.mf-base p{margin:0;max-width:72ch}
.totop{flex:none;margin-left:auto;color:var(--dim);border-bottom:1px solid var(--rule);padding-bottom:2px}
.totop:hover{color:var(--white);border-color:var(--dim)}

.stage{position:fixed;left:0;right:0;bottom:0;z-index:0;height:var(--stage-h,calc(22.3vw + 80px));background:var(--black)}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.reveal{height:var(--stage-h,calc(22.3vw + 80px))}

@media (max-width:1060px){
  .mf-cols{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mfoot .in{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
}
@media (max-width:560px){
  .mf-cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px}
  .mf-head{flex-direction:column;align-items:flex-start}
  .mf-head h2{font-size:28px}
  .mf-base{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.chev,.top>li>button::after,.arr,.mega,.top>li.open>.mega{transition:none}}
</style>

<div class="hero" role="img" aria-label="HHMI homepage hero image"></div>
<footer class="mfoot" id="mfoot"><div class="in">

  <div class="mf-base"><a class="totop" href="#" id="totop">Back to top <span aria-hidden="true">↑</span></a></div>
</div></footer>
</main>
<div class="reveal" id="reveal" aria-hidden="true"></div>

re", "r": "careers/interests"}, {"l": "Lead a laboratory", "r": "careers/interests/lead"}, {"l": "Pursue hands-on research", "r": "careers/interests/research"}, {"l": "Build AI for science", "r": "careers/interests/ai"}, {"l": "Find fellowship support", "r": "careers/interests/fellowships"}, {"l": "Contribute technical or professional expertise", "r": "careers/interests/professional"}], "f": "Not in any menu in prototype"}, {"l": "Other roles at HHMI", "r": "careers/other-roles"}, {"l": "Prototype guide", "r": "guide"}, {"l": "Janelia prototype guide", "r": "janelia/prototype-guide", "f": "Not linked in prototype"}]}];

};
(function(){
  var top=document.getElementById('top'),toggle=document.getElementById('toggle');
  var mobile=function(){return window.matchMedia('(max-width:1060px)').matches};
  var selEl=null;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function isGroup(n){return !n.r&&!!n.k}
  function isHeading(n){return isGroup(n)&&n.k.every(function(x){return !x.k})}
  function a(n,cls,label){return '<a class="'+(cls||'')+'" href="#" data-r="'+esc(n.r)+'"><span class="t">'+esc(label||n.l)+'</span>'+(n.f?'<span class="flag">'+esc(n.f)+'</span>':'')+'</a>'}
  function li(n){
    if(isHeading(n))return '<li class="sub">'+esc(n.l)+'</li>'+n.k.map(li).join('');
    if(n.t)return '<li class="q"><a class="t2" href="#" data-r="'+esc(n.r)+'"><span class="t">'+esc(n.l)+'</span></a><a class="tech" href="#" data-r="'+esc(n.t)+'" aria-label="Technical statement: '+esc(n.l)+'">Tech</a></li>';
    var kids=(n.k||[]).filter(function(c){return c.r!==n.r});
    return '<li>'+a(n)+(kids.length?'<ul>'+kids.map(li).join('')+'</ul>':'')+'</li>';
  }
  function col(title,r,items){
    return '<div class="col"><h3>'+(r?'<a href="#" data-r="'+esc(r)+'">'+esc(title)+'</a>':esc(title))+'</h3><ul>'+items.map(li).join('')+'</ul></div>';
  }
  // Loose pages gather in a first column; every child with its own pages becomes a column.
  function columns(node,leadTitle){
    var leaves=[],cols=[],extra='';
    node.k.forEach(function(c){
      if(!c.k){leaves.push(c);return}
      var fields=c.k.filter(function(g){return isGroup(g)&&g.k.some(isGroup)});
      if(fields.length){ // Open questions: links column here, full question lists in their own row
        var hub=c.k.filter(function(g){return g.r});
        var byField=fields.map(function(f){var all=f.k.filter(function(x){return x.r})[0];return {l:({Biology:'For biologists',AI:'For AI researchers',Theory:'For theorists',Tools:'For tool builders'})[f.l]||f.l,r:all&&all.r}});
        cols.push(col(c.l,c.r,hub.concat(byField)));
        extra='<div class="qrow"><h4>Open questions by field</h4><div class="cols c4">'+fields.map(function(f){
          var all=f.k.filter(function(x){return x.r})[0];
          return col(f.l,all&&all.r,f.k.filter(function(x){return !x.r}));
        }).join('')+'</div></div>';
        return;
      }
      cols.push(col(c.l,c.r,c.k.filter(function(x){return x.r!==c.r})));
    });
    return '<div class="cols">'+(leaves.length?col(leadTitle,null,leaves):'')+cols.join('')+'</div>'+extra;
  }
  function intro(n){
    return '<div class="intro"><h2>'+esc(n.l)+'</h2><p>'+esc(INTRO[n.l]||'')+'</p>'+(n.r?'<a class="go" href="#" data-r="'+esc(CTA[n.l]?CTA[n.l][1]:n.r)+'">'+esc(CTA[n.l]?CTA[n.l][0]:'Go to '+n.l)+' <span aria-hidden="true">→</span></a>':'')+'</div>';
  }
  function janelia(n){
    var home=n.k.filter(function(c){return !c.k}),secs=n.k.filter(function(c){return c.k});
    var rail='<ul class="rail" role="tablist" aria-label="Janelia sections">'+home.map(function(h){return '<li role="presentation"><a href="#" data-r="'+esc(h.r)+'">'+esc(h.l)+'</a></li>'}).join('')+
      secs.map(function(s,i){return '<li role="presentation"><button role="tab" id="jt'+i+'" aria-controls="jp'+i+'" aria-selected="'+(i===0)+'" data-i="'+i+'">'+esc(s.l)+'<span class="arr" aria-hidden="true">→</span></button></li>'}).join('')+'</ul>';
    var panels=secs.map(function(s,i){
      return '<div class="tabpanel" role="tabpanel" id="jp'+i+'" aria-labelledby="jt'+i+'"'+(i?' hidden':'')+'><div class="tabhead"><h3>'+esc(s.l)+'</h3>'+'</div>'+columns(s,'Overview')+'</div>';
    }).join('');
    return '<div class="railwrap">'+rail+'<div>'+panels+'</div></div>';
  }
  function close(el){el.classList.remove('open');el.firstChild.setAttribute('aria-expanded','false')}
  TREE.forEach(function(n){
    var el=document.createElement('li');
    var body=n.l==='Janelia'?janelia(n):columns(n,n.l==='More'?'Also on the site':'Overview');
    el.innerHTML='<button aria-expanded="false">'+esc(n.l)+'<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>'+
      '<div class="mega"><div class="inner">'+intro(n)+'<div>'+body+'</div></div></div>';
    var btn=el.firstChild,t;
    function open(){[].forEach.call(top.children,function(s){if(s!==el)close(s)});el.classList.add('open');btn.setAttribute('aria-expanded','true')}
    el.addEventListener('mouseenter',function(){if(mobile())return;clearTimeout(t);open()});
    el.addEventListener('mouseleave',function(){if(mobile())return;t=setTimeout(function(){close(el)},200)});
    btn.addEventListener('click',function(e){e.stopPropagation();el.classList.contains('open')?close(el):open()});
    var tabs=el.querySelectorAll('.rail button');
    tabs.forEach(function(b){
      function show(){tabs.forEach(function(x){x.setAttribute('aria-selected',x===b)});el.querySelectorAll('.tabpanel').forEach(function(p,i){p.hidden=String(i)!==b.dataset.i})}
      b.addEventListener('mouseenter',function(){if(!mobile())show()});
      b.addEventListener('click',function(e){e.stopPropagation();show()});
    });
    el.querySelector('.mega').addEventListener('click',function(e){
      e.stopPropagation();var l=e.target.closest('a[data-r]');if(!l)return;e.preventDefault();
      if(selEl)selEl.classList.remove('sel');selEl=l;l.classList.add('sel');
    });
    top.appendChild(el);
  });
  document.addEventListener('click',function(){if(!mobile())[].forEach.call(top.children,close)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')[].forEach.call(top.children,close)});
  toggle.addEventListener('click',function(e){e.stopPropagation();var s=top.classList.toggle('show');document.body.classList.toggle('menu-lock',s);toggle.setAttribute('aria-expanded',s);toggle.textContent=s?'Close':'Menu'});
})();
</script>
<script>
/* Mega footer: one column per header section, built from the same TREE as the menu. */
(function(){
  var cols=document.getElementById('mfcols'),sel=null;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function link(n){return '<li><a href="#" data-r="'+esc(n.r)+'"><span class="t">'+esc(n.l)+'</span></a></li>'}
  cols.innerHTML=TREE.map(function(n){
    var items=n.k.filter(function(c){return c.r!==n.r}).map(function(c){
      if(c.r)return link(c);
      return '<li class="sub">'+esc(c.l)+'</li>'+(c.k||[]).filter(function(x){return x.r}).map(link).join('');
    }).join('');
    var h=n.r?'<a href="#" data-r="'+esc(n.r)+'">'+esc(n.l)+'</a>':esc(n.l);
    return '<div class="col"><h3>'+h+'</h3><ul>'+items+'</ul></div>';
  }).join('');
  cols.addEventListener('click',function(e){
    var l=e.target.closest('a[data-r]');if(!l)return;e.preventDefault();
    if(sel)sel.classList.remove('sel');sel=l;l.classList.add('sel');
  });
  document.getElementById('totop').addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  });
})();

/* Particle wordmark. The page above lifts away like a curtain to uncover it; the wordmark is already in place and reacts to the pointer. */
(function(){
  var COLORS=['#8B8B8B','#8B8B8B','#8B8B8B','#8B8B8B','#8B8B8B']; // h, h, m, i stem, i dot (document order)
  var PATHS=[].map.call(document.querySelectorAll('.brand svg path, .brand svg polygon'),function(el){
    return new Path2D(el.tagName.toLowerCase()==='polygon'?'M'+el.getAttribute('points').trim().split(/\s+/).join(' ').replace(/(\S+ \S+) /g,'$1 L')+' Z':el.getAttribute('d'));
  });
  var VB_W=128,VB_H=38,FILL=.75;
  var cv=document.getElementById('particles'),ctx=cv.getContext('2d'),spacer=document.getElementById('reveal');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)');
  var P=[],G=[],W=0,H=0,r=1.5,DPR=1,img=null,buf=null,R=80,lastW=-1,raf=0,visible=false;
  var mouse={x:-1e4,y:-1e4,on:false,f:4,base:4};

  function dot(){return 1}   // particle size in CSS px, all screens
  function layout(){
    var w=document.documentElement.clientWidth;
    var pad=Math.max(40,Math.min(120,w*.06)),lw=w*FILL,lh=lw*VB_H/VB_W,h=Math.round(lh+pad*2);
    document.documentElement.style.setProperty('--stage-h',h+'px');
    if(w===lastW)return;lastW=w;W=w;H=h;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    DPR=dpr;img=ctx.createImageData(cv.width,cv.height);buf=new Uint32Array(img.data.buffer);
    var d=dot(w),gap=3,s=lw/VB_W,ox=(W-lw)/2,oy=(H-lh)/2;
    r=d/2;R=Math.max(50,W*.06);
    var t=document.createElement('canvas').getContext('2d');
    var groups={};P=[];
    for(var y=gap/2;y<lh;y+=gap)for(var x=gap/2;x<lw;x+=gap){
      for(var i=0;i<PATHS.length;i++){
        if(t.isPointInPath(PATHS[i],x/s,y/s)){
          var p={hx:x+ox,hy:y+oy,x:x+ox,y:y+oy,vx:0,vy:0,e:.7+Math.random()*.6};
          (groups[COLORS[i]]=groups[COLORS[i]]||[]).push(p);P.push(p);break;
        }
      }
    }
    G=Object.keys(groups).map(function(c){return {c:c,p:groups[c]}});
    draw();
  }
  function step(){
    var moving=0,R2=R*R,m=mouse.on,k=.045;
    mouse.f+=(mouse.base-mouse.f)*.06;
    for(var i=0;i<P.length;i++){
      var p=P[i],ax=(p.hx-p.x)*k*p.e,ay=(p.hy-p.y)*k*p.e;
      if(m){var dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy;
        if(d2<R2&&d2>.01){var d=Math.sqrt(d2),f=(1-d/R)*mouse.f/d;ax+=dx*f;ay+=dy*f}}
      p.vx=(p.vx+ax)*.86;p.vy=(p.vy+ay)*.86;p.x+=p.vx;p.y+=p.vy;
      if(Math.abs(p.vx)+Math.abs(p.vy)>.03||Math.abs(p.hx-p.x)+Math.abs(p.hy-p.y)>.4)moving++;
    }
    return moving;
  }
  // Packs a #RRGGBB color into one 32-bit pixel (canvas pixels are RGBA bytes, read little-endian).
  function px(hex){var n=parseInt(hex.slice(1),16);return (0xFF000000|((n&255)<<16)|(n&0xFF00)|(n>>16))>>>0}
  function draw(){
    if(r<=.75){ // 1px dots: write squares straight into the pixel buffer (much faster than drawing shapes)
      var cw=cv.width,ch=cv.height,sz=Math.max(1,Math.round(r*2*DPR));
      buf.fill(0);
      for(var g=0;g<G.length;g++){
        var a=G[g].p,c=px(G[g].c);
        for(var i=0;i<a.length;i++){
          var x0=Math.round((a[i].x-r)*DPR),y0=Math.round((a[i].y-r)*DPR);
          if(x0<0||y0<0||x0+sz>cw||y0+sz>ch)continue;
          for(var yy=0;yy<sz;yy++){var o=(y0+yy)*cw+x0;for(var xx=0;xx<sz;xx++)buf[o+xx]=c}
        }
      }
      ctx.putImageData(img,0,0);
      return;
    }
    ctx.clearRect(0,0,W,H);
    for(var g=0;g<G.length;g++){
      var a=G[g].p;ctx.fillStyle=G[g].c;ctx.beginPath();
      for(var i=0;i<a.length;i++){var p=a[i];ctx.moveTo(p.x+r,p.y);ctx.arc(p.x,p.y,r,0,6.2832)}
      ctx.fill();
    }
  }
  function frame(){
    raf=0;var moving=step();draw();
    if(visible&&(moving||mouse.on||mouse.f>mouse.base+.1))raf=requestAnimationFrame(frame);
  }
  function kick(){if(!raf&&visible&&!reduce.matches)raf=requestAnimationFrame(frame)}

  new IntersectionObserver(function(es){visible=es[es.length-1].isIntersecting;kick()},{threshold:0}).observe(spacer);

  function at(e){var b=cv.getBoundingClientRect();mouse.x=e.clientX-b.left;mouse.y=e.clientY-b.top}
  cv.addEventListener('pointermove',function(e){at(e);mouse.on=true;kick()});
  cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){mouse.on=false;mouse.x=mouse.y=-1e4}});
  cv.addEventListener('pointerdown',function(e){at(e);mouse.on=true;mouse.f=16;kick()});   // click or tap: bigger burst
  function lift(e){if(e.pointerType!=='mouse')setTimeout(function(){mouse.on=false},300)}
  cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);

  var rq=0;window.addEventListener('resize',function(){if(rq)return;rq=requestAnimationFrame(function(){rq=0;layout();kick()})});
  layout();
})();
</script>
