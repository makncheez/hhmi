<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call for Applicants</title>
<!--BOOTSTRAP-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<!--/BOOTSTRAP-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap">
<style>
  /* Layout: Bootstrap 12-col grid. Revolving text in col-lg-6, Apply box in col-lg-6,
     framed by HHMI marks and gradient rules. */
  :root {
    --cfa-bg: #000;
    --cfa-fg: #fff;          /* label + active word */
    --cfa-green: #00AC1D;
    --cfa-green-hover: #009A1A;
    --cfa-blue: #0086A4;
    --cfa-ink: #1c1c1c;      /* text on the green box */
    --cfa-rule: 2px;
    --cfa-dim-max: 28;       /* lightness % of the words next to center */
    --cfa-dim-min: 12;       /* lightness % of the farthest words */
    --cfa-font-label: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --cfa-font-word: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--cfa-bg);
    color: var(--cfa-fg);
  }
  .cfa-page {
    min-height: 100%;
    display: flex;
    align-items: center;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .cfa-page > .container { width: 100%; }

  /* ---------- Band: HHMI marks + gradient rules ---------- */
  .cfa-mark {
    font: 400 14px/1 var(--cfa-font-label);
    letter-spacing: 0.02em;
    color: var(--cfa-fg);
  }
  .cfa-marks-top .cfa-mark { padding-bottom: 14px; }
  .cfa-marks-bottom .cfa-mark { padding-top: 14px; }
  .cfa-rule { height: var(--cfa-rule); }
  .cfa-rule--top    { background: linear-gradient(90deg, var(--cfa-blue), var(--cfa-green)); }
  .cfa-rule--bottom { background: linear-gradient(90deg, var(--cfa-green), var(--cfa-blue)); }
  .cfa-text-col { display: flex; flex-direction: column; }
  .cfa-text-col .cfa { flex: 1 1 auto; padding-right: 24px; }

  /* ---------- Apply box ---------- */
  .cfa-apply {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 240px;
    padding: 32px 16px;
    background: var(--cfa-green);
    color: var(--cfa-ink);
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    font: 400 clamp(32px, 3.6vw, 60px)/1.15 var(--cfa-font-word);
    letter-spacing: 0.04em;
    transition: background-color 0.2s ease;
  }
  .cfa-apply:hover { background: var(--cfa-green-hover); color: var(--cfa-ink); }
  .cfa-apply:focus-visible { outline: 2px solid var(--cfa-fg); outline-offset: 3px; }

  /* ---------- Call for Applicants: revolving text ---------- */
  .cfa {
    display: flex;
    align-items: center;          /* label sits on the drum's center line */
    gap: clamp(12px, 1.6vw, 24px);
  }
  .cfa-label {
    flex: none;
    margin: 0;
    font: 400 14px/1 var(--cfa-font-label);
    letter-spacing: 0.02em;
    white-space: nowrap;
    color: var(--cfa-fg);
  }
  .cfa-drum {
    --cfa-size: 40px;
    --cfa-row: 48px;
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    height: calc(var(--cfa-row) * 7);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 76%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 76%, transparent 100%);
  }
  .cfa-word {
    position: absolute;
    top: 0;
    left: 0;
    height: var(--cfa-row);
    display: flex;
    align-items: center;
    white-space: nowrap;
    font: 500 var(--cfa-size)/1 var(--cfa-font-word);
    letter-spacing: -0.02em;
    color: hsl(0 0% calc(var(--cfa-dim-max) * 1%));
    will-change: transform, color;
  }
  .cfa-sr {
    position: absolute !important;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<main class="cfa-page">
  <div class="container">
    <div class="cfa-band">

      <!-- Marks: H . H -->
      <div class="row g-0 cfa-marks-top" aria-hidden="true">
        <div class="col-6"><span class="cfa-mark">H</span></div>
        <div class="col-6"><span class="cfa-mark">H</span></div>
      </div>

      <!-- Top rule: full width, blue to green -->
      <div class="cfa-rule cfa-rule--top"></div>

      <div class="row g-0">
        <!-- 6 columns: revolving text, bottom rule underneath -->
        <div class="col-12 col-lg-6 cfa-text-col">
          <section class="cfa" data-cfa aria-label="Call for applicants">
            <p class="cfa-label">Looking for</p>
            <p class="cfa-sr"></p>
            <div class="cfa-drum" aria-hidden="true"></div>
          </section>
          <!-- Bottom rule: text area only, green to blue -->
          <div class="cfa-rule cfa-rule--bottom"></div>
        </div>

        <!-- 6 columns: Apply box -->
        <div class="col-12 col-lg-6 cfa-apply-col">
          <a class="cfa-apply" href="#apply">Apply<br>Here</a>
        </div>
      </div>

      <!-- Marks: M . I -->
      <div class="row g-0 cfa-marks-bottom" aria-hidden="true">
        <div class="col-6"><span class="cfa-mark">M</span></div>
        <div class="col-6"><span class="cfa-mark">I</span></div>
      </div>

    </div>
  </div>
</main>

<script>
(function () {
  /* ---- Settings ---- */
  // Placeholder roles. Add or remove freely; any length works.
  var WORDS = [
    "Technologist", "Futurist", "Engineer", "Undergraduate", "Graduate",
    "Chemist", "AI Scientist", "Biologist", "Physicist", "Data Scientist"
  ];
  var START_INDEX = 3;          // word centered on load ("Undergraduate")
  var SECONDS_PER_WORD = 1.8;   // scroll speed: time for one word to move up one row
  var VISIBLE_ROWS = 7;         // rows visible in the drum (keep odd)
  var LINE = 1.2;               // row height as a multiple of font size
  var MIN_SIZE = 22, MAX_SIZE = 72;  // font size bounds (px)

  var root = document.querySelector("[data-cfa]");
  if (!root) return;
  var drum = root.querySelector(".cfa-drum");
  root.querySelector(".cfa-sr").textContent = "Looking for: " + WORDS.join(", ") + ".";

  var css = getComputedStyle(document.documentElement);
  var DIM_MAX = parseFloat(css.getPropertyValue("--cfa-dim-max")) || 28;
  var DIM_MIN = parseFloat(css.getPropertyValue("--cfa-dim-min")) || 12;

  // Repeat the list so the loop never shows a gap, even with few words.
  var items = [];
  var copies = Math.max(1, Math.ceil((VISIBLE_ROWS + 3) / WORDS.length));
  for (var c = 0; c < copies; c++) {
    WORDS.forEach(function (w) {
      var el = document.createElement("span");
      el.className = "cfa-word";
      el.textContent = w;
      drum.appendChild(el);
      items.push(el);
    });
  }

  var row = 48;
  // Scroll position, in rows. Chosen so START_INDEX sits on the center line.
  var phase = START_INDEX - VISIBLE_ROWS / 2 - 0.5;

  // Fit the longest word to the drum's width.
  var canvas = document.createElement("canvas").getContext("2d");
  function measure() {
    canvas.font = '500 100px "Space Grotesk", "Helvetica Neue", Arial, sans-serif';
    var widest = 0;
    WORDS.forEach(function (w) {
      // subtract letter-spacing (-0.02em)
      var width = canvas.measureText(w).width - w.length * 2;
      if (width > widest) widest = width;
    });
    var avail = drum.clientWidth;
    var size = Math.max(MIN_SIZE, Math.min(MAX_SIZE, (avail * 0.97) / (widest / 100)));
    row = size * LINE;
    drum.style.setProperty("--cfa-size", size.toFixed(2) + "px");
    drum.style.setProperty("--cfa-row", row.toFixed(2) + "px");
  }

  function lightness(d) {
    // d = distance from center line, in rows
    if (d <= 0.3) return 100;
    if (d < 1) {
      var t = (d - 0.3) / 0.7, s = t * t * (3 - 2 * t);
      return 100 + (DIM_MAX - 100) * s;
    }
    return Math.max(DIM_MIN, DIM_MAX - (d - 1) * 6);
  }

  function render() {
    var total = items.length * row;
    var center = (row * VISIBLE_ROWS) / 2;
    var off = phase * row;
    for (var i = 0; i < items.length; i++) {
      var y = (((i * row - off) % total) + total) % total - row;
      var d = Math.abs(y + row / 2 - center) / row;
      items[i].style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
      items[i].style.color = "hsl(0 0% " + lightness(d).toFixed(1) + "%)";
    }
  }

  // Animation loop: continuous upward scroll, infinite.
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var last = null, raf = 0;
  function tick(now) {
    if (last !== null) {
      var dt = Math.min(0.1, (now - last) / 1000);
      phase = (phase + dt / SECONDS_PER_WORD) % (items.length);
    }
    last = now;
    render();
    raf = requestAnimationFrame(tick);
  }
  function start() {
    cancelAnimationFrame(raf);
    last = null;
    if (reduce.matches) { render(); return; }   // static list, middle word white
    raf = requestAnimationFrame(tick);
  }
  if (reduce.addEventListener) reduce.addEventListener("change", start);

  measure(); render(); start();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('500 100px "Space Grotesk"').then(function () { measure(); render(); });
  }
  if ("ResizeObserver" in window) {
    new ResizeObserver(function () { measure(); render(); }).observe(drum);
  } else {
    window.addEventListener("resize", function () { measure(); render(); });
  }
})();
</script>
</body>
</html>
